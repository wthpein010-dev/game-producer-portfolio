<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">数据迭代职责图示</title><desc id="desc">职责图示：数据迭代的工作范围与成果证据分成两个层次阅读</desc><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#174b55}.label{font:18px 'Segoe UI',sans-serif;letter-spacing:3px}.title{font-size:48px;font-weight:700}.body{font-size:28px}.small{font-size:22px;fill:#4b6570}.inverse{fill:#fff}</style><rect width="960" height="600" fill="#174b55"/><text x="64" y="72" class="label inverse">03 / DATA / ITERATION</text><text x="64" y="143" class="title inverse">数据迭代</text><rect x="64" y="233" width="832" height="118" rx="20" fill="#ddecee"/><text x="102" y="282" class="label">SCOPE</text><text x="102" y="325" class="body">已确认的职责范围</text><rect x="64" y="378" width="832" height="118" rx="20" fill="#ffdfbf"/><text x="102" y="427" class="label">EVIDENCE</text><text x="102" y="470" class="body">成果结合可核验证据阅读</text><text x="64" y="554" style="font-size:22px;fill:#d9e9ee">工作范围与具体成果，分层阅读</text></svg>
